name: Deploy Operon v2 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "operon-v2/**"
      - ".github/workflows/deploy-operon-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: operon-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: operon-v2/package-lock.json

      - name: Install dependencies
        working-directory: operon-v2
        run: npm ci

      - name: Build static site
        working-directory: operon-v2
        run: npm run build

      - name: Install Playwright for validation
        working-directory: operon-v2
        run: npx playwright install chromium --with-deps

      - name: Validate site output
        working-directory: operon-v2
        run: |
          node scripts/dev-server.mjs &
          echo $! > /tmp/operon-server.pid
          sleep 2
          npm run validate
          kill "$(cat /tmp/operon-server.pid)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: operon-v2/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
