name: Deploy Operon v2 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "operon-v2/**"
      - ".github/workflows/deploy-operon-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operon-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: operon-v2/package-lock.json

      - name: Install dependencies
        working-directory: operon-v2
        run: npm ci

      - name: Build static site
        working-directory: operon-v2
        run: npm run build

      - name: Install Playwright for validation
        working-directory: operon-v2
        run: npx playwright install chromium --with-deps

      - name: Validate site output
        working-directory: operon-v2
        run: |
          node scripts/dev-server.mjs &
          echo $! > /tmp/operon-server.pid
          sleep 2
          npm run validate
          kill "$(cat /tmp/operon-server.pid)"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: operon-site
          path: operon-v2/site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: operon-site
          path: operon-v2/site

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: operon-v2/site
          cname: www.operonworks.hu
